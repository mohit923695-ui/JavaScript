<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
  <link rel="stylesheet" href="main.css">
  <style>
     .calculator {
    background-color:dimgrey;
  border: 2px solid rgb(64, 64, 64);
  border-radius: 10px;
  width: 400px;
  padding: 15px;
}

#display {
  margin: 10px 0;
  width: 100%;
  height: 50px;
  box-sizing: border-box;
  font-size: 24px;
}
.button-containor {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.button {
  height: 70px;
  font-size: 20px;
}
.button1{
  background-color: rgb(226, 7, 7);
  border:2px solid black;
}
  </style>
</head>
<body>
  <div class="calculator" >
    <input type="text" id="display" readonly>
    <div class="button-containor">
      <button  class="button1" onclick="clearDisplay()"><h1>C</h1></button>
      <button class="button" onclick="appendToDisplay('1')">1</button>
      
      <button class="button" onclick="appendToDisplay('2')">2</button>

      <button class="button" onclick="appendToDisplay('+')">+</button>

      <button class="button" onclick="appendToDisplay('3')">3</button>

      <button class="button" onclick="appendToDisplay('4')">4</button>

      <button class="button" onclick="appendToDisplay('-')">-</button>

      <button class="button" onclick="appendToDisplay('5')">5</button>

      <button class="button" onclick="appendToDisplay('6')">6</button>

      <button class="button" onclick="appendToDisplay('*')">*</button>

      <button class="button" onclick="appendToDisplay('7')">7</button>

      <button class="button" onclick="appendToDisplay('8')">8</button>

      <button class="button" onclick="appendToDisplay('/')">/</button>

      <button class="button" onclick="calculate()">=</button>

      <button class="button" onclick="appendToDisplay('9')">9</button>

      <button class="button" onclick="appendToDisplay('0')">0</button>

      <button class="button" onclick="appendToDisplay('.')">.</button>
      <button class="button" onclick="display.value = display.value.slice(0,-1)">x</button>
  </div>
  <script>
    let currentdispaly = '';
    const display = document.querySelector('#display');

    function appendToDisplay(value) {
      currentdispaly += value;
      display.value = currentdispaly;
    }

    function clearDisplay() {
      currentdispaly = '';
      display.value = '';
    }

    function calculate() {
      try {
        currentdispaly = String(Function(`"use strict"; return (${currentdispaly})`)());
        display.value = currentdispaly;
      } catch {
        clearDisplay();
      }
    }
  </script>
</body>
</html>
