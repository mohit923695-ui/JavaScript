<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if alternative</title>
</head>
<body>
  <script>
    // ternary operator
    let age = 31;
    let result = age > 18 ? 'adult' : 'kid';
    console.log(result);
  </script>
</body>
</html>
