<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>project </title>
  <link rel="stylesheet" href="main.css">
  <style>
    .classbtn{
      color: red;
    }
    .bag{
      background-color: green;
      padding: 5px 15px 5px 15px;
      border: none;
      border-radius: 7px;
    }
    .wish{
      border: 2px solid black;
      padding: 5px 35px 5px 25px;

    }
  </style>
</head>
<body>
  <main>
    <button class="bag" onclick="cartquantity = cartquantity + 1; document.querySelector('#cart_summary').innerText = `Your cart quantity: ${cartquantity}`;">add to bag</button>
    <button class="wish" onclick="cartquantity = cartquantity - 1; document.querySelector('#cart_summary').innerText = `Your cart quantity: ${cartquantity}`;">move to wishlist</button>
    <button class="bag" onclick="cartquantity = cartquantity + 2; document.querySelector('#cart_summary').innerText = `Your cart quantity: ${cartquantity}`;
    ">add 1+1 sale itmes </button>
    <h1 id="cart_summary"></h1>

  </main>
  
<script>
  let cartquantity = 0;
  document.querySelector('#cart_summary').innerText = `Your cart quantity: ${cartquantity}`;

</script>
</body>
</html>
